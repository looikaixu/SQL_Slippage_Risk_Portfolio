# Reuters / LSEG export header -> canonical field.
# Matching is case-insensitive, punctuation-insensitive; first alias found in the file wins.
# After the first real export, put the exact header text first in each list.

trade_date:    [date, exchange date, trade date, timestamp]
ric:           [ric, instrument, identifier, code]
open:          [open, open price]
high:          [high, high price]
low:           [low, low price]
close:         [close, last, trade close, close price, last price, universal close price]
settle:        [settle, settlement, settlement price, sett, settle price, official close]
volume:        [volume, vol, accumulated volume, acvol]
open_interest: [open interest, oi, open int, open interest contracts]
