name: pricebook

on:
  push:
    paths: ["trading_data/**", ".github/workflows/pricebook.yml"]
  pull_request:
    paths: ["trading_data/**", ".github/workflows/pricebook.yml"]

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trading_data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: trading_data/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - run: python -m pricebook validate
